name: Update sources

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Recheck every configured source regardless of page changes'
        type: boolean
        default: false
      sources:
        description: 'Space-separated source ids to recheck regardless of page changes'
        required: false
        default: ''
      brief:
        description: 'Optional task context for the data agent'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sources
  cancel-in-progress: false

env:
  TITLE: 'chore: update pricing data'

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set the temporary plan directory
        run: echo "PLAN=$RUNNER_TEMP/source-updates" >> "$GITHUB_ENV"

      - name: Detect provider page changes
        id: detect
        timeout-minutes: 3
        env:
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_PROVIDER_ID: ${{ vars.AGENT_PROVIDER_ID }}
          AGENT_BASE_URL: ${{ vars.AGENT_BASE_URL }}
          FORCE_SOURCES: ${{ inputs.sources }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          node scripts/check-providers.js "${args[@]}"

      - name: Install OpenCode
        if: steps.detect.outputs.changed != ''
        timeout-minutes: 4
        run: npm install --global opencode-ai@1.19.4

      - name: Propose pricing updates
        id: propose
        if: steps.detect.outputs.changed != ''
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          OPENCODE_CONFIG_CONTENT: ${{ steps.detect.outputs.opencode_config }}
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
          OPENCODE_PERMISSION: >-
            {"*":"deny","read":{"*":"allow","**/.env*":"deny","**/.git/**":"deny"},"grep":"allow","glob":"allow","webfetch":"allow","edit":{"*":"deny","**/data/sources.json":"allow","data/sources.json":"allow"}}
          MODEL: ${{ steps.detect.outputs.model }}
          CHANGED_SOURCES: ${{ steps.detect.outputs.changed }}
          BRIEF: ${{ inputs.brief }}
        run: |
          if [[ -z "$AGENT_API_KEY" ]]; then
            echo '::error::Configure the AGENT_API_KEY repository secret.'
            exit 1
          fi
          # Stop OpenCode before the job deadline so validation and PR creation can still run.
          agent_status=0
          timeout --kill-after=15s 30m opencode run --pure --agent build --model "$MODEL" \
            "$(printf 'Changed source ids: %s\nTask context: %s\n\n' "$CHANGED_SOURCES" "$BRIEF"; cat .github/update-sources-prompt.md)" \
            || agent_status=$?
          if [[ "$agent_status" == 124 || "$agent_status" == 137 ]]; then
            echo '::warning::OpenCode reached its time limit. Checking completed entries for a review PR.'
            echo 'timed_out=true' >> "$GITHUB_OUTPUT"
          else
            exit "$agent_status"
          fi

      - name: Separate automatic updates from changes that need review
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_SOURCES: ${{ steps.detect.outputs.changed }}
          UNAVAILABLE_SOURCES: ${{ steps.detect.outputs.unavailable }}
          AGENT_TIMED_OUT: ${{ steps.propose.outputs.timed_out }}
        run: |
          git diff --quiet HEAD -- . ':(exclude)data/sources.json' ':(exclude)data/.state/page-hashes.json'
          test -z "$(git ls-files --others --exclude-standard)"
          if [[ "$AGENT_TIMED_OUT" != true ]]; then node scripts/build-sources.js; fi

          # Retain unmerged review candidates when the agent discovers other changes.
          REVIEW_HEAD=$(gh pr list --head chore/review-pricing-data --base main \
            --state open --json headRefOid --jq '.[0].headRefOid // ""')
          if [[ -n "$REVIEW_HEAD" ]]; then git fetch --no-tags origin "$REVIEW_HEAD"; fi
          REVIEW_HEAD="$REVIEW_HEAD" node scripts/plan-source-updates.js "$PLAN"
          if [[ "$AGENT_TIMED_OUT" == true && ! -f "$PLAN/review.json" ]]; then
            echo '::error::OpenCode timed out without a new candidate ready for review.'
            exit 1
          fi
          git restore --source=HEAD --staged --worktree -- data/sources.json src/data/sources.js data/.state/page-hashes.json

          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$(git rev-parse HEAD)" != "$latest" ]]; then
            echo '::error::Main changed during generation. Retry from the latest revision.'
            exit 1
          fi
          if [[ -f "$PLAN/auto.json" ]]; then echo 'auto=true' >> "$GITHUB_OUTPUT"; fi
          if [[ -f "$PLAN/review.json" ]]; then echo 'review=true' >> "$GITHUB_OUTPUT"; fi

      - name: Validate the automatic update
        id: validate_auto
        if: steps.plan.outputs.auto == 'true'
        run: |
          cp "$PLAN/auto.json" data/sources.json
          if [[ -f "$PLAN/hashes.json" ]]; then cp "$PLAN/hashes.json" data/.state/page-hashes.json; fi
          node scripts/build-sources.js
          node test/run-tests.js
          node test/integration-test.js
          node test/check-providers-test.js
          git diff --check HEAD
          git add data/sources.json src/data/sources.js data/.state/page-hashes.json
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the automatic update PR
        id: auto_pr
        if: steps.plan.outputs.auto == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: chore/update-pricing-data
          delete-branch: true
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          add-paths: |
            data/sources.json
            src/data/sources.js
            data/.state/page-hashes.json
          title: ${{ env.TITLE }}
          commit-message: ${{ env.TITLE }}
          body-path: ${{ runner.temp }}/source-updates/auto.md

      - name: Merge the tested update if repository rules permit
        id: merge
        if: steps.auto_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.auto_pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.auto_pr.outputs.pull-request-head-sha }}
          VALIDATED_TREE: ${{ steps.validate_auto.outputs.tree }}
          BASE_SHA: ${{ steps.validate_auto.outputs.base }}
        run: |
          test -n "$HEAD_SHA"
          git fetch --no-tags origin "$HEAD_SHA"
          if [[ "$(git rev-parse "$HEAD_SHA^{tree}")" != "$VALIDATED_TREE" ||
                "$(git rev-parse "$HEAD_SHA^")" != "$BASE_SHA" ||
                "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$BASE_SHA" ]]; then
            echo "::error::PR #$PR no longer matches the update tested on main."
            exit 1
          fi
          if merged=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" \
            -f sha="$HEAD_SHA" -f merge_method=squash -f commit_title="$TITLE" -f commit_message='' \
            --jq 'select(.merged) | .sha') && [[ -n "$merged" ]]; then
            echo "sha=$merged" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub did not merge PR #$PR. The validated update remains open for review."
          fi

      - name: Validate the review update on the current base
        if: steps.plan.outputs.review == 'true'
        env:
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          git restore --source=HEAD --staged --worktree -- data/sources.json src/data/sources.js data/.state/page-hashes.json
          git fetch --no-tags origin main
          expected=${MERGED_SHA:-$(git rev-parse HEAD)}
          if [[ "$(git rev-parse FETCH_HEAD)" != "$expected" ]]; then
            echo '::error::Main changed during publication. Retry from the latest revision.'
            exit 1
          fi
          git merge --ff-only FETCH_HEAD
          if [[ -n "$MERGED_SHA" ]]; then
            cp "$PLAN/combined.json" data/sources.json
          else
            cp "$PLAN/review.json" data/sources.json
          fi
          node scripts/build-sources.js
          node test/run-tests.js
          node test/integration-test.js
          node test/check-providers-test.js
          timeout --kill-after=10s 90s node scripts/check-patterns.js || echo '::warning::AA model audit did not complete.'
          git diff --check HEAD

      - name: Open or refresh the review PR
        if: steps.plan.outputs.review == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: chore/review-pricing-data
          delete-branch: true
          labels: needs-review
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          add-paths: |
            data/sources.json
            src/data/sources.js
          title: ${{ env.TITLE }}
          commit-message: ${{ env.TITLE }}
          body-path: ${{ runner.temp }}/source-updates/review.md

      - name: Record provider hashes when no automatic data update is needed
        if: steps.plan.outputs.auto != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f "$PLAN/hashes.json" ]]; then exit 0; fi
          cp "$PLAN/hashes.json" data/.state/page-hashes.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/.state/page-hashes.json
          git commit -m 'chore: refresh provider page hashes'
          gh auth setup-git
          git push origin HEAD:refs/heads/main
