name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match manifest version v$VERSION"
            exit 1
          fi

      - name: Run tests
        run: node test/run-tests.js

      - name: Package
        run: |
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          zip -r "repriceaa-v${VERSION}.zip" manifest.json src LICENSE
          node scripts/build-userscript.js repriceaa.user.js

      - name: Create draft release
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload assets
        run: gh release upload "$GITHUB_REF_NAME" repriceaa-v*.zip repriceaa.user.js
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
